<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login | Face Attendance</title>


<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    body {

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );

        color: #1e293b;

    }


    .login-container {

        width: 100%;

        max-width: 420px;

        padding: 20px;

    }


    .login-card {

        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow:
            0 15px 40px
            rgba(15, 23, 42, 0.10);

    }


    .logo {

        width: 65px;

        height: 65px;

        margin: 0 auto 20px;

        border-radius: 18px;

        background: #eef2ff;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 30px;

    }


    .title {

        text-align: center;

        margin-bottom: 8px;

        font-size: 28px;

        font-weight: 700;

    }


    .subtitle {

        text-align: center;

        color: #64748b;

        font-size: 14px;

        margin-bottom: 30px;

    }


    .form-group {

        margin-bottom: 20px;

    }


    label {

        display: block;

        font-size: 14px;

        font-weight: 600;

        margin-bottom: 8px;

    }


    input {

        width: 100%;

        padding: 13px 14px;

        border: 1px solid #d1d5db;

        border-radius: 10px;

        outline: none;

        font-size: 14px;

        transition: 0.2s;

    }


    input:focus {

        border-color: #4f46e5;

        box-shadow:
            0 0 0 3px
            rgba(79, 70, 229, 0.10);

    }


    .login-button {

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 10px;

        background: #4f46e5;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;

    }


    .login-button:hover {

        background: #4338ca;

    }


    .messages {

        margin-bottom: 20px;

    }


    .error {

        padding: 12px;

        border-radius: 8px;

        background: #fee2e2;

        color: #b91c1c;

        font-size: 13px;

        text-align: center;

    }


    .back-link {

        display: block;

        text-align: center;

        margin-top: 25px;

        text-decoration: none;

        color: #64748b;

        font-size: 13px;

    }


    .back-link:hover {

        color: #4f46e5;

    }


    .footer {

        text-align: center;

        margin-top: 20px;

        font-size: 12px;

        color: #94a3b8;

    }


</style>
```

</head>

<body>

<div class="login-container">

```
<div class="login-card">


    <div class="logo">
        🔐
    </div>


    <h1 class="title">
        Admin Login
    </h1>


    <p class="subtitle">
        Sign in to manage your attendance system
    </p>


    {% if messages %}

    <div class="messages">

        {% for message in messages %}

            <div class="error">

                {{ message }}

            </div>

        {% endfor %}

    </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button">

            Login to Dashboard

        </button>

    </form>


    <a
        href="{% url 'dashboard' %}"
        class="back-link">

        ← Back to Attendance

    </a>


</div>


<div class="footer">

    Face Recognition Attendance System

</div>
```

</div>

</body>

</html>
