<!DOCTYPE html>
<html>

<head>

    <title>Delete Employee</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 80px;
        }

        .card {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        button,
        a {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #dc2626;
            color: white;
        }

        a {
            background: #e2e8f0;
            color: #475569;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>Delete Employee?</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ employee.emp_name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'admin_dashboard' %}">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
