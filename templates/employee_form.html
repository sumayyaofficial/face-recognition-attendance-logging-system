<!DOCTYPE html>
<html>

<head>

    <title>{{ title }}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 50px;
        }

        .form-card {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button,
        a {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #4f46e5;
            color: white;
        }

        .cancel {
            background: #e2e8f0;
            color: #475569;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .errorlist {
            color: red;
            padding-left: 20px;
        }

    </style>

</head>

<body>

<div class="form-card">

    <h1>{{ title }}</h1>

    <form
        method="POST"
        enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">

            <button type="submit">
                Save Employee
            </button>

            <a
                href="{% url 'admin_dashboard' %}"
                class="cancel">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>

</html>
