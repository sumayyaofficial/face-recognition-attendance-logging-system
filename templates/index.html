<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Face Attendance</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6fb;

            color: #1e293b;

        }


        .navbar {

            background: white;

            padding: 18px 40px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.05);

        }


        .logo {

            font-size: 22px;

            font-weight: bold;

        }


        .logo span {

            color: #4f46e5;

        }


        .container {

            max-width: 1100px;

            margin: 40px auto;

            padding: 20px;

        }


        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            margin-bottom: 8px;

        }


        .header p {

            color: #64748b;

        }


        .camera-card {

            background: white;

            max-width: 700px;

            margin: auto;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.06);

        }


.camera-container {
    position: relative;
    width: 650px;
    max-width: 100%;
    aspect-ratio: 4 / 3;
    background: black;
    overflow: hidden;
    border-radius: 12px;
}

#camera {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
    object-fit: fill;
    object-fit: contain;

    z-index: 1;
}
#camera {
    transform: scaleX(-1);
}

#overlay {
    transform: none;
}
#overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    pointer-events: none;
}

#canvas {
    display: none;
}

        .camera-status {

            text-align: center;

            margin-top: 20px;

            padding: 12px;

            background: #f8fafc;

            border-radius: 10px;

            font-weight: 600;

        }


        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        button {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

        }


        .start {

            background: #4f46e5;

            color: white;

        }


        .stop {

            background: #fee2e2;

            color: #dc2626;

        }


        .attendance-message {

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            display: none;

            text-align: center;

        }


        .success {

            display: block;

            background: #dcfce7;

            color: #166534;

        }


        .warning {

            display: block;

            background: #fef3c7;

            color: #92400e;

        }


        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }




        @media(max-width:600px) {

            .navbar {

                padding: 15px 20px;

            }

            .container {

                margin: 20px auto;

            }

            .buttons {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <span>Face</span> Attendance

    </div>

</nav>


<div class="container">


    <div class="header">

        <h1>
            Employee Attendance
        </h1>

        <p>
            Look at the camera and blink naturally
            to mark your attendance.
        </p>

    </div>


    <div class="camera-card">

        <form style="display:none;">
        {% csrf_token %}
    </form>
        <div class="camera-container">

    <video
        id="camera"
        autoplay
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


        <div
            id="status"
            class="camera-status">

            Camera is off

        </div>


        <div
            id="message"
            class="attendance-message">
        </div>


        <div class="buttons">

            <button
                class="start"
                onclick="startCamera()">

                Start Camera

            </button>


            <button
                class="stop"
                onclick="stopCamera()">

                Stop Camera

            </button>

        </div>


        <canvas
            id="canvas">
        </canvas>


    </div>


</div>


<script>

const csrftoken = getCookie("csrftoken");

let video = document.getElementById("camera");

let overlay = document.getElementById("overlay");

let ctx = overlay.getContext("2d");

let stream = null;

let recognitionRunning = false;

let processing = false;


/* -----------------------------------------
   CSRF
----------------------------------------- */

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies =
            document.cookie.split(";");

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) === name + "="
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}


/* -----------------------------------------
   START CAMERA
----------------------------------------- */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = stream;


        document.getElementById(
            "status"
        ).innerText =
            "Camera started";


        recognitionRunning = true;


        /*
         * Wait until video is ready
         */

        video.onloadedmetadata = function() {

            overlay.width =
                video.videoWidth;

            overlay.height =
                video.videoHeight;

            continuousRecognition();

        };


    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "Camera permission denied";

    }

}


/* -----------------------------------------
   STOP CAMERA
----------------------------------------- */

function stopCamera() {

    recognitionRunning = false;

    processing = false;


    if(stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }


    video.srcObject = null;


    clearOverlay();


    document.getElementById(
        "status"
    ).innerText =
        "Camera is off";

}


/* -----------------------------------------
   CONTINUOUS RECOGNITION
----------------------------------------- */

async function continuousRecognition() {

    while(recognitionRunning) {

        /*
         * Don't send another request while
         * the previous request is processing.
         */

        if(!processing) {

            await recognizeCurrentFrame();

        }

        /*
         * Small delay between recognition attempts
         */

        await sleep(700);

    }

}


/* -----------------------------------------
   RECOGNIZE CURRENT FRAME
----------------------------------------- */

async function recognizeCurrentFrame() {

    if(!video.videoWidth) {

        return;

    }


    processing = true;


    try {

        /*
         * Create temporary canvas
         */

        const canvas =
            document.createElement("canvas");


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const canvasContext =
            canvas.getContext("2d");


        /*
         * Mirror image because camera
         * is displayed mirrored.
         */
        canvasContext.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * Convert frame to JPEG
         */

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        /*
         * Send to Django
         */

        const formData =
            new FormData();


        formData.append(
            "image",
            image
        );


        const response =
            await fetch(
                "{% url 'recognize' %}",
                {

                    method: "POST",

                    headers: {
                        "X-CSRFToken":
                            csrftoken
                    },

                    body: formData

                }
            );


        const result =
            await response.json();


        console.log(
            "Recognition:",
            result
        );

        console.log("DJANGO RESULT:", result);
        console.log("FACES:", result.faces);
        /*
         * Draw returned faces
         */

        if(result.faces) {

            drawFaces(
                result.faces
            );

        }
        else {

            clearOverlay();

        }


        /*
         * Status
         */

        if(result.face_detected) {

            document.getElementById(
                "status"
            ).innerText =
                "Face detected";

        }
        else {

            document.getElementById(
                "status"
            ).innerText =
                "Looking for face...";

        }


        /*
         * Show employee message
         */

        const recognizedFace =
            result.faces?.find(
                face => face.recognized
            );


        if(recognizedFace) {

            document.getElementById(
                "status"
            ).innerText =
                "✓ " +
                recognizedFace.name;


            if(
                recognizedFace.attendance_marked
            ) {

                showMessage(

                    "✓ Attendance marked<br>" +

                    "<strong>" +
                    recognizedFace.name +
                    "</strong><br>" +

                    recognizedFace.designation +
                    "<br>" +

                    "First Login: " +
                    recognizedFace.time,

                    "success"

                );

            }
            else {

                showMessage(

                    "✓ Already marked today<br>" +

                    "<strong>" +
                    recognizedFace.name +
                    "</strong><br>" +

                    recognizedFace.designation +
                    "<br>" +

                    "First Login: " +
                    recognizedFace.time,

                    "warning"

                );

            }

        }


    }

    catch(error) {

        console.error(
            "Recognition error:",
            error
        );

    }


    processing = false;

}


/* -----------------------------------------
   DRAW FACE RECTANGLES
----------------------------------------- */

function drawFaces(faces) {

    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    if (!videoWidth || !videoHeight) {
        return;
    }


    // -----------------------------------------
    // SET CANVAS TO ORIGINAL VIDEO SIZE
    // -----------------------------------------

    overlay.width = videoWidth;
    overlay.height = videoHeight;


    // -----------------------------------------
    // CLEAR PREVIOUS BOXES
    // -----------------------------------------

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    // -----------------------------------------
    // DRAW EVERY FACE
    // -----------------------------------------

    faces.forEach(function(face) {

        // Original coordinates from Django

        let left =
            Number(face.left);

        let right =
            Number(face.right);

        let top =
            Number(face.top);

        let bottom =
            Number(face.bottom);


        // -----------------------------------------
        // MIRROR ONLY X COORDINATES
        // -----------------------------------------
        //
        // Video is mirrored visually.
        // Canvas is NOT mirrored.
        //
        // Therefore we mirror the coordinates.
        // -----------------------------------------

        const originalLeft = left;
        const originalRight = right;


        left =
            videoWidth - originalRight;

        right =
            videoWidth - originalLeft;


        // -----------------------------------------
        // DEBUG
        // -----------------------------------------

        console.log(
            "FACE:",
            {
                left: left,
                top: top,
                right: right,
                bottom: bottom,
                name: face.name
            }
        );


        // -----------------------------------------
        // BOX COLOR
        // -----------------------------------------

        ctx.strokeStyle =
            face.recognized
                ? "#00ff00"
                : "#ff0000";


        ctx.lineWidth = 4;


        // -----------------------------------------
        // DRAW RECTANGLE
        // -----------------------------------------

        ctx.strokeRect(
            left,
            top,
            right - left,
            bottom - top
        );


        // -----------------------------------------
        // NAME
        // -----------------------------------------

        const name =
            face.recognized
                ? face.name
                : "Unknown";


        const designation =
            face.recognized
                ? face.designation
                : "";


        const label =
            designation
                ? name + " - " + designation
                : name;


        // -----------------------------------------
        // TEXT
        // -----------------------------------------

        ctx.font =
            "bold 18px Arial";


        const textWidth =
            ctx.measureText(label).width;


        const labelWidth =
            textWidth + 20;


        const labelHeight =
            32;


        let labelY =
            top - labelHeight;


        if (labelY < 0) {

            labelY = top;

        }


        // -----------------------------------------
        // LABEL BACKGROUND
        // -----------------------------------------

        ctx.fillStyle =
            face.recognized
                ? "#16a34a"
                : "#dc2626";


        ctx.fillRect(
            left,
            labelY,
            labelWidth,
            labelHeight
        );


        // -----------------------------------------
        // LABEL TEXT
        // -----------------------------------------

        ctx.fillStyle =
            "#ffffff";


        ctx.fillText(
            label,
            left + 10,
            labelY + 22
        );

    });
}
/* -----------------------------------------
   CLEAR RECTANGLES
----------------------------------------- */

function clearOverlay() {

    if (!overlay) {
        return;
    }

    const rect =
        video.getBoundingClientRect();

    overlay.width =
        rect.width;

    overlay.height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

}

/* -----------------------------------------
   MESSAGE
----------------------------------------- */

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "attendance-message " +
        type;

}


/* -----------------------------------------
   SLEEP
----------------------------------------- */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

</script>

</body>

</html>
